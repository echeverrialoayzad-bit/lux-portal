<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lux Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lux-portal.css') }}">
    <style>
        .login-container {
            display: flex;
            min-height: 100vh;
        }

        /* Left Side - Branding */
        .login-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #ec4899 0%, #d946ef 50%, #a855f7 100%);
        }

        .branding-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 420px;
        }

        .branding-logo {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 36px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: logoFloat 6s ease-in-out infinite;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .branding-logo i {
            font-size: 3.2rem;
            color: #fff;
        }

        .branding-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .branding-subtitle {
            font-size: 1.125rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.7;
            margin-bottom: 48px;
        }

        .branding-features {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .feature-item i {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* Floating shapes - Soft circles */
        .shape {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 0;
            animation: shapeFloat 20s ease-in-out infinite;
        }

        .shape-1 {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            top: 8%;
            left: -60px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            bottom: 12%;
            right: -40px;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            top: 55%;
            left: 8%;
            animation-delay: -10s;
        }

        .shape-4 {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            top: 25%;
            right: 15%;
            animation-delay: -15s;
            background: rgba(255, 255, 255, 0.08);
        }

        @keyframes shapeFloat {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-25px); }
            50% { transform: translateY(15px); }
            75% { transform: translateY(-15px); }
        }

        /* Right Side - Form */
        .login-form-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            background: #fffbfc;
        }

        .login-form-container {
            width: 100%;
            max-width: 400px;
        }

        .form-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .form-header h2 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .form-header p {
            color: #7c5270;
            font-size: 1rem;
        }

        .login-form .form-group {
            margin-bottom: 24px;
        }

        .login-form .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a1942;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #a78bba;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            padding-left: 52px;
        }

        .input-wrapper input:focus ~ i,
        .input-wrapper:focus-within i {
            color: #ec4899;
        }

        .login-form .form-control {
            height: 58px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(225, 29, 116, 0.12);
            border-radius: 16px;
            font-size: 1rem;
            color: #4a1942;
            transition: all 0.3s ease;
        }

        .login-form .form-control:focus {
            background: #fff;
            border-color: rgba(236, 72, 153, 0.5);
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.12);
        }

        .login-form .form-control::placeholder {
            color: #a78bba;
        }

        .btn-login {
            width: 100%;
            height: 58px;
            background: linear-gradient(135deg, #ec4899 0%, #d946ef 50%, #a855f7 100%);
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 12px;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(236, 72, 153, 0.4);
        }

        .btn-login i {
            transition: transform 0.3s ease;
        }

        .btn-login:hover i {
            transform: translateX(4px);
        }

        /* Footer */
        .login-footer {
            position: absolute;
            bottom: 32px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .login-footer span {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Orb animations for form side */
        .form-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite;
        }

        .form-orb-1 {
            width: 320px;
            height: 320px;
            background: rgba(244, 114, 182, 0.15);
            top: -120px;
            right: -120px;
        }

        .form-orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(192, 132, 252, 0.12);
            bottom: -120px;
            left: -120px;
            animation-delay: -9s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(25px, -25px) scale(1.05); }
        }

        /* Responsive */
        @media (max-width: 992px) {
            .login-container {
                flex-direction: column;
            }

            .login-branding {
                padding: 48px 32px;
                min-height: auto;
            }

            .branding-title {
                font-size: 2.5rem;
            }

            .branding-features {
                display: none;
            }

            .login-form-side {
                padding: 48px 32px;
            }

            .shape {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Branding Side -->
        <div class="login-branding">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>

            <div class="branding-content">
                <div class="branding-logo">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                </div>
                <h1 class="branding-title">Lux Portal</h1>
                <p class="branding-subtitle">Centro de operaciones y herramientas empresariales de alto rendimiento</p>

                <div class="branding-features">
                    <div class="feature-item">
                        <i class="bi bi-shield-check"></i>
                        <span>Acceso seguro y encriptado</span>
                    </div>
                    <div class="feature-item">
                        <i class="bi bi-lightning-charge"></i>
                        <span>Rendimiento optimizado</span>
                    </div>
                    <div class="feature-item">
                        <i class="bi bi-collection"></i>
                        <span>Multiples modulos integrados</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Form Side -->
        <div class="login-form-side">
            <div class="form-orb form-orb-1"></div>
            <div class="form-orb form-orb-2"></div>

            <div class="login-form-container" style="position: relative; z-index: 1;">
                <div class="form-header">
                    <h2>Bienvenida</h2>
                    <p>Ingrese sus credenciales para continuar</p>
                </div>

                {% if error %}
                <div class="alert alert-danger mb-4" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Usuario</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Ingrese su usuario" required autofocus>
                            <i class="bi bi-person"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Contrasena</label>
                        <div class="input-wrapper">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Ingrese su contrasena" required>
                            <i class="bi bi-lock"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login">
                        Iniciar Sesion
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <span>Lux Portal</span> v1.0
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

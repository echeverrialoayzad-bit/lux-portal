{% extends "base.html" %}

{% block title %}Nuevo Cliente - Current Status{% endblock %}

{% block nav_items %}
<li class="nav-item">
    <a class="nav-link" href="{{ url_for('current_status.dashboard') }}">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
    </a>
</li>
{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 500px; margin: 0 auto;">
    <h2 class="section-title mb-4">
        <i class="bi bi-plus-circle me-2"></i>Nuevo Cliente
    </h2>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">Nombre del Cliente</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: GDM" required autofocus>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-check-lg"></i> Crear Cliente
                    </button>
                    <a href="{{ url_for('current_status.dashboard') }}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

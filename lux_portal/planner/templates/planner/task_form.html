{% extends 'planner/base_planner.html' %}
{% block title %}{% if task %}Editar{% else %}Nueva{% endif %} Tarea - Planner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="bi bi-check2-square me-2" style="color: var(--planner-lavender)"></i>{% if task %}Editar{% else %}Nueva{% endif %} Tarea</h4>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Titulo *</label>
                        <input type="text" class="form-control" name="title" required value="{{ task.title if task else '' }}" placeholder="Que necesitas hacer?">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripcion</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Detalles adicionales...">{{ task.description if task else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Prioridad</label>
                            <select class="form-select" name="priority">
                                <option value="high" {% if task and task.priority == 'high' %}selected{% endif %}>Alta</option>
                                <option value="medium" {% if not task or task.priority == 'medium' %}selected{% endif %}>Media</option>
                                <option value="low" {% if task and task.priority == 'low' %}selected{% endif %}>Baja</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha limite</label>
                            <input type="date" class="form-control" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task and task.due_date else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hora inicio</label>
                            <input type="time" class="form-control" name="start_time" value="{{ task.start_time.strftime('%H:%M') if task and task.start_time else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hora fin</label>
                            <input type="time" class="form-control" name="end_time" value="{{ task.end_time.strftime('%H:%M') if task and task.end_time else '' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Categoria</label>
                        <select class="form-select" name="category">
                            <option value="general" {% if not task or task.category == 'general' %}selected{% endif %}>General</option>
                            <option value="trabajo" {% if task and task.category == 'trabajo' %}selected{% endif %}>Trabajo</option>
                            <option value="personal" {% if task and task.category == 'personal' %}selected{% endif %}>Personal</option>
                            <option value="urgente" {% if task and task.category == 'urgente' %}selected{% endif %}>Urgente</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{{ url_for('planner.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary flex-grow-1">Guardar Tarea</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
